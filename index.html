<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intensity</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Arial', sans-serif; overflow: hidden; }
        
        /* ድምፅ እንዲጀምር የሚጠይቅ የመጀመሪያ ቁልፍ */
        #start-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            display: flex; justify-content: center; align-items: center;
            background: #000; z-index: 1000; cursor: pointer;
        }
        .start-btn { padding: 20px 40px; border: 2px solid #ff0055; color: #ff0055; font-size: 20px; text-transform: uppercase; letter-spacing: 5px; }

        #main { display: none; text-align: center; padding-top: 100px; }

        /* የልብ ቅርፅ በኮድ */
        .heart {
            width: 100px; height: 90px; background: #ff0055;
            position: relative; margin: 0 auto 50px;
            transform: rotate(-45deg); animation: beat 0.8s infinite;
        }
        .heart:before, .heart:after {
            content: ""; width: 100px; height: 100px; background: #ff0055;
            border-radius: 50%; position: absolute;
        }
        .heart:before { top: -50px; left: 0; }
        .heart:after { top: 0; left: 50px; }

        @keyframes beat { 0%, 100% { transform: scale(1) rotate(-45deg); } 50% { transform: scale(1.2) rotate(-45deg); } }

        h1 { font-size: 3rem; color: #ff0055; text-transform: uppercase; margin-bottom: 20px; }
        p { font-size: 1.5rem; line-height: 1.8; color: #ddd; max-width: 80%; margin: 0 auto; }
    </style>
</head>
<body>

    <audio id="music" src="Song.MP3" loop></audio>

    <div id="start-screen" onclick="start()">
        <div class="start-btn">ENTER THE FIRE</div>
    </div>

    <div id="main">
        <div class="heart"></div>
        <h1>You are my obsession.</h1>
        <p>Your presence is the only thing that sets my world on fire.<br>
           No distance, no time, just us.<br>
           You are not just a choice, you are the only destiny I crave.</p>
    </div>

    <script>
        function start() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            document.getElementById('music').play();
        }
    </script>
</body>
</html>
